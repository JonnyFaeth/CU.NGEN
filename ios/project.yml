name: CULantern
options:
  deploymentTarget:
    iOS: '16.0'
targets:
  CULantern:
    type: application
    platform: iOS
    sources:
      - path: CULantern
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cungen.lantern
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: CU uses the camera and LiDAR to measure your light locally. No scan is uploaded.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.11.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
schemes:
  CULantern:
    build:
      targets:
        CULantern: all
